<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERRA ARCHIVE — Daftar Akun</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
<style>
  body.login-body{
    overflow:auto; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .login-box{
    width:340px;
    padding:32px;
    border:1px solid var(--border);
    background:var(--bg-panel);
  }
  .login-box .brand{ justify-content:center; margin-bottom:24px; }
  .login-box h1{
    font-family:'Rajdhani', sans-serif; font-weight:700;
    font-size:20px; letter-spacing:2px; text-align:center; margin-bottom:8px;
  }
  .login-sub{
    text-align:center; font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; color:var(--text-muted); margin-bottom:24px;
  }
  .login-error, .login-success{
    display:none;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    padding:10px 12px;
    margin-bottom:16px;
  }
  .login-error{
    color:var(--danger);
    border:1px solid var(--danger);
    background:rgba(161,69,61,0.1);
  }
  .login-success{
    color:var(--accent);
    border:1px solid var(--accent-dim);
    background:rgba(242,163,57,0.08);
  }
  .login-error.show, .login-success.show{ display:block; }
  .switch-link{
    text-align:center; margin-top:16px;
    font-family:'IBM Plex Mono', monospace; font-size:11px;
    color:var(--text-muted);
  }
  .switch-link a{ color:var(--accent); }
</style>
</head>
<body class="login-body">

<div class="login-box">
  <div class="brand">
    <div class="brand-mark"></div>
  </div>
  <h1>DAFTAR AKUN BARU</h1>
  <p class="login-sub">Akun baru otomatis berperan sebagai VIEWER (hanya bisa melihat)</p>

  <div class="login-error" id="registerError"></div>
  <div class="login-success" id="registerSuccess"></div>

  <form id="registerForm" class="admin-form">
    <label>Username</label>
    <input type="text" id="username" required autofocus minlength="3">

    <label>Password (minimal 6 karakter)</label>
    <input type="password" id="password" required minlength="6">

    <label>Ulangi Password</label>
    <input type="password" id="passwordConfirm" required minlength="6">

    <div class="form-actions">
      <button type="submit" class="rhodes-btn" style="width:100%;">DAFTAR</button>
    </div>
  </form>

  <p class="switch-link">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
</div>

<script src="js/register.js"></script>
</body>
</html>
